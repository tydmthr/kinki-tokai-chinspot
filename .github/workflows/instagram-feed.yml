name: Update Instagram Feed

on:
  schedule:
    # 毎日 06:00 JST = 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手動実行も可

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Instagram posts
        env:
          IG_LONG_TOKEN: ${{ secrets.IG_LONG_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
        run: |
          python3 scripts/fetch_instagram_feed.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-feed.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update Instagram feed [skip ci]"
            git push
          fi

      - name: Refresh long-lived token
        if: github.event_name == 'schedule' && github.run_number == 1
        env:
          IG_LONG_TOKEN: ${{ secrets.IG_LONG_TOKEN }}
        run: |
          # 50日経過時にトークン延長（実装は後日）
          echo "Token refresh placeholder"
